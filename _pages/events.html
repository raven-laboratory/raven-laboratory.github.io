---
layout: archive
title: Events
permalink: /events/
author_profile: true
---

<link rel="stylesheet" href="/_pages/global.css">

<div class="card-list">
  {% assign events = site.data.events | sort: "date" | reverse %}

  {% for e in events %}
  <div class="card-item">
    <div class="card-main">{{ e.title }}</div>
    <div class="card-field">{{ e.description }}</div>
    <div class="card-field"><a href="{{ e.url }}">{{ e.url }}</a><p class="date">{{ e.date }}</p></div>
  </div>
  {% endfor %}
</div>
